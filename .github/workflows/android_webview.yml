name: Build Android Webview App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Manual trigger ke liye option

jobs:
  build:
    name: Build Webview Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository Code Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. JDK Setup (Java 17 / Android Build ke liye required)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Android SDK Setup
      - name: Setup Android SDK
        uses: actions/setup-android@v3

      # 4. Gradle Executable Permissions
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 5. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Upload Built APK as Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: webview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

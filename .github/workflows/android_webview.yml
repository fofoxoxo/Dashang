name: Build Android Webview App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Webview Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Path
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # AGAR AAPKA CODE SUB-FOLDER ME HAI (eg: android), TOH working-directory SET KAREIN
      - name: Grant Execute Permission for Gradlew
        working-directory: ./android # Agar subfolder ka naam 'android' hai toh ise change karein
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android # Same folder name yahan bhi rakhein
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: webview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
